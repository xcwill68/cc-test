name: Roamie
options:
  bundleIdPrefix: com.roamie
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_PREVIEWS: YES
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.roamie.app

targets:
  Roamie:
    type: application
    platform: iOS
    info:
      path: Roamie/Info.plist
      properties:
        NSLocationWhenInUseUsageDescription: "Roamie 需要您的位置来自动将当前城市添加到行程。"
        NSLocationAlwaysAndWhenInUseUsageDescription: "开启后台定位，Roamie 可在旅行途中记录您的路线。"
        NSPhotoLibraryAddUsageDescription: "将您的旅行动图保存到相册，随时分享。"
        NSPhotoLibraryUsageDescription: "Roamie 需要访问相册来选择打卡照片。"
        UILaunchScreen:
          UIImageName: ""
          UIBackgroundColor: "#1C1C2E"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Roamie
    sources:
      - path: Roamie
        excludes:
          - Resources/Assets.xcassets
      - path: Roamie/Resources/Assets.xcassets
        type: folder
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: AVFoundation.framework
      - sdk: ImageIO.framework
      - sdk: CoreImage.framework
      - sdk: PhotosUI.framework
      - sdk: Photos.framework
      - sdk: UniformTypeIdentifiers.framework

  RoamieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RoamieTests
    dependencies:
      - target: Roamie

  RoamieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RoamieUITests
    dependencies:
      - target: Roamie
